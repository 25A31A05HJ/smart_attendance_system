<!DOCTYPE html>
<html>

<head>

    <title>Attendance Records</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
        }

        th {
            background: #333;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        .present {
            font-weight: bold;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #555;
            color: white;
        }

    </style>

</head>

<body>

    <h1>📋 Attendance Records</h1>

    {% if records %}

    <table>

        <tr>

            <th>Student ID</th>

            <th>Name</th>

            <th>Date</th>

            <th>Time</th>

            <th>Status</th>

        </tr>


        {% for record in records %}

        <tr>

            <td>
                {{ record["student_id"] }}
            </td>

            <td>
                {{ record["name"] }}
            </td>

            <td>
                {{ record["date"] }}
            </td>

            <td>
                {{ record["time"] }}
            </td>

            <td class="present">
                {{ record["status"] }}
            </td>

        </tr>

        {% endfor %}

    </table>

    {% else %}

    <p>No attendance records found.</p>

    {% endif %}


    <button
        onclick="window.location.href='/'">
        Return Home
    </button>

</body>

</html>
