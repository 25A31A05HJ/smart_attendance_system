<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 10px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #263238;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #37474f;
        }

        .message {
            margin: 15px 0;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Register Student</h1>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

    <form method="POST"
          action="/register"
          enctype="multipart/form-data">

        <label for="student_id">
            Student ID
        </label>

        <input
            type="text"
            id="student_id"
            name="student_id"
            placeholder="Enter Student ID"
            required
        >


        <label for="name">
            Student Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter Student Name"
            required
        >


        <label for="department">
            Department
        </label>

        <input
            type="text"
            id="department"
            name="department"
            placeholder="Example: CSE"
            required
        >


        <label for="face_image">
            Face Image
        </label>

        <input
            type="file"
            id="face_image"
            name="face_image"
            accept="image/*"
            required
        >


        <button type="submit">
            Register Student
        </button>

    </form>

    <a href="/">
        Back to Home
    </a>

</div>

</body>
</html>
